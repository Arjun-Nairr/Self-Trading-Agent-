#
# hermes-trading-agent — a SEPARATE Hermes Agent instance, isolated from:
#   - the Telegram-bot install at AppData\Local\hermes\hermes-agent
#   - the hermes-pipeline instance at ~/.hermes-pipeline
#
# Isolation is via the data volume + container names/network below: same
# public image, own ~/.hermes-trading-agent data dir, own network, own
# containers. Nothing shared.
#
# Headless: no chat platform (Telegram/etc) configured — the cron scheduler
# runs standalone via CLI per Hermes' own docs, gateway delivery to a
# platform is optional and can be added later without a rebuild.
#
# Topology: separate container per tool, HTTP transport. Each tool gets
# its own bridge network shared only with `gateway` — no tool can reach
# another tool, only `gateway` can reach any of them, and nothing is
# published to the host (see §12B).
#
# Usage:
#   docker compose up -d
#
services:
  gateway:
    # Pinned by digest (2026-08-28) -- Hermes Agent v0.20.0 (2026.8.3), the
    # exact image confirmed working end to end with the locked
    # openai-codex / gpt-5.4-mini configuration throughout this project
    # (see HANDOFF.md). `:latest` is a MOVING tag -- any future `docker
    # compose pull`/rebuild could silently swap in a newer Hermes release
    # (the real one on record is v0.20.6, six patches ahead) mid-training,
    # with no diff to review and no way to know reproducibility broke
    # until something behaves differently. Digest-pinning makes a rebuild
    # from this file reproduce the EXACT same image bytes, always. To
    # deliberately upgrade later: pull the new tag, confirm it behaves
    # identically (this project's own smoke-test discipline), then update
    # this digest as its own reviewed change -- never silently.
    image: nousresearch/hermes-agent@sha256:7052fcafb84acaf0d93f78510a51c344ca2041d4ba7dda9dca67660f817309c4
    container_name: hermes-trading-agent
    restart: unless-stopped
    networks:
      - net-maverick
      - net-newsrss
      - net-journal
      - net-execution
      - net-execution-sim
    volumes:
      - ${USERPROFILE}/.hermes-trading-agent:/opt/data
      # SOUL.md (identity), AGENTS.md (procedure), RULES.md (the risk layer)
      # live in this repo so they're version-controlled, and are mounted
      # READ-ONLY so no reflection cycle can quietly rewrite its own risk
      # limits or identity — RULES.md's own header specifies exactly this.
      # SOUL.md must sit at HERMES_HOME root; AGENTS.md/RULES.md must sit in
      # the working dir Hermes runs cycles from (/opt/data/workspace), which
      # is where the context tier picks up project files. Verified by real
      # load-test, not assumed.
      - ./SOUL.md:/opt/data/SOUL.md:ro
      - ./AGENTS.md:/opt/data/workspace/AGENTS.md:ro
      - ./RULES.md:/opt/data/workspace/RULES.md:ro
    environment:
      - HERMES_UID=10000
      - HERMES_GID=10000
    command: ["gateway", "run"]

  # maverick-mcp — third-party (wshobson/maverick-mcp), free, no API key,
  # yfinance-based technicals. HTTP transport, own container, no host port
  # published — reachable only from `gateway` on net-maverick.
  # ponytail: upstream's example compose wires Postgres+Redis, but both are
  # opt-in (maverick/platform/config.py falls back to SQLite for either one
  # when DATABASE_URL/REDIS_HOST are unset) — at our scale (one process,
  # hourly cron, a handful of tickers) SQLite covers it with 2 fewer
  # containers. Revisit if maverick-mcp is ever run as >1 instance.
  maverick-mcp:
    build:
      context: ./maverick-mcp
    container_name: hermes-trading-agent-maverick-mcp
    restart: unless-stopped
    networks:
      - net-maverick
    environment:
      - DATABASE_URL=sqlite:////app/data/maverick.db
      - CACHE_SQLITE_PATH=/app/data/maverick_cache.db
    volumes:
      - maverick-data:/app/data
    # No HEALTHCHECK: upstream ships none (MCP server, not a REST API, no
    # /health endpoint). Milestone 1's step 5 verifies liveness via
    # Hermes' own logs (tool registration), not a container healthcheck.

  # google-news-rss-mcp — our own minimal wrapper (feedparser + FastMCP)
  # around news.google.com/rss/search. One tool: fetch_headlines. Returns
  # raw headline data only, no parsing-as-instructions — see server.py.
  google-news-rss-mcp:
    build:
      context: ./google-news-rss-mcp
    container_name: hermes-trading-agent-google-news-rss-mcp
    restart: unless-stopped
    networks:
      - net-newsrss

  # trade-journal-mcp — our own tool (asyncpg + FastMCP) over Neon
  # (eu-central-1). Writes with the full-credential NEON_DATABASE_URL from
  # .env; the dashboard reads separately via Neon's Data API using the
  # anonymous role (SELECT-only, see schema.sql) — two different paths,
  # this container never serves the browser directly.
  trade-journal:
    build:
      context: ./trade-journal-mcp
    container_name: hermes-trading-agent-trade-journal
    restart: unless-stopped
    networks:
      - net-journal
    env_file:
      - .env

  # execution-sim-mcp — DEV/MANUAL TOOL ONLY, not the active execution
  # backend. Was the fallback while Upstox (then Alpaca) wasn't wired up
  # yet; kept around for local testing without burning real Alpaca API
  # calls. NOT auto-registered in config.yaml — deliberately not an
  # automatic failover if alpaca-mcp has an outage (see
  # project_hermes_trading_agent memory for why: idempotency and
  # execution_mode tagging both assume one execution path per decision,
  # and §6's "pause, don't fallback" principle applies here too).
  # 2026-08-29 correctness pass #4 hygiene: own network, not net-execution
  # (shared with alpaca-mcp) -- the header's hub-and-spoke claim ("no tool
  # container can reach another") wasn't actually true for these two while
  # they shared a bridge network.
  execution-sim:
    build:
      context: ./execution-sim-mcp
    container_name: hermes-trading-agent-execution-sim
    restart: "no"
    networks:
      - net-execution-sim

  # alpaca-mcp — OUR OWN tool (place_order, get_positions, get_order_status)
  # over Alpaca's Paper Trading API. Rebuilt after the official
  # alpacahq/alpaca-mcp-server turned out to bundle stock/crypto/options
  # order placement into one tool with no config-level way to restrict to
  # stocks only (confirmed via their code AND via Alpaca's own dashboard —
  # the account-level options-trading-level setting doesn't touch crypto
  # either). This tool structurally can't place a crypto/options order:
  # that code was never written, not "disabled." Always paper (hardcoded
  # base URL, no live-mode flag to misconfigure). See
  # project_hermes_trading_agent memory for the full decision history.
  alpaca-mcp:
    build:
      context: ./alpaca-mcp
    container_name: hermes-trading-agent-alpaca-mcp
    restart: unless-stopped
    networks:
      - net-execution
    # 2026-08-29 correctness pass #4 hygiene: explicit environment, not
    # env_file: .env -- env_file handed this container ALL THREE .env
    # vars, including NEON_DATABASE_URL, which alpaca-mcp never reads and
    # has no business holding (least privilege; also matches trade-
    # journal-mcp being the ONLY container that touches Neon at all).
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
    volumes:
      # Mounted, not COPYed: one risk_checker and one watchlist for the
      # whole project. A per-container copy would be a second source of
      # truth for the rules — exactly the drift this project keeps fixing.
      - ./risk-checker/risk_checker.py:/app/risk_checker.py:ro
      - ./watchlist/watchlist.json:/app/watchlist.json:ro

  # dashboard — the existing static frontend (dashboard/index.html),
  # unchanged, served locally so it doesn't depend on GitHub Pages (which
  # currently 404s -- this project has no public deploy for it, and isn't
  # getting one: this is a private learning project, and the anonymous Neon
  # role the page reads through exposes selected journal rows to anyone who
  # has the endpoint URL -- see README/HANDOFF. Bound to 127.0.0.1 ONLY
  # (not 0.0.0.0) so nothing outside this machine can reach it -- no build,
  # no framework, just python's stdlib http.server over the existing file.
  dashboard:
    # Pinned by digest (2026-08-28) -- see gateway's comment above for why;
    # same currently-installed python:3.12-slim digest as every project
    # Dockerfile's FROM line, for one consistent base across the stack.
    image: python@sha256:dd29372629eeba2dd003fd9e9d35a5b8236c44727875a0364254b5127af88e65
    container_name: hermes-trading-agent-dashboard
    restart: unless-stopped
    working_dir: /srv
    volumes:
      - ./dashboard:/srv:ro
    ports:
      - "127.0.0.1:8842:8000"
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0"]
    # ^ binds 0.0.0.0 INSIDE the container (normal -- it's an isolated
    # network namespace); the 127.0.0.1 above is what actually restricts
    # real host-network reachability to this machine only.

networks:
  net-maverick:
    driver: bridge
  net-newsrss:
    driver: bridge
  net-journal:
    driver: bridge
  net-execution:
    driver: bridge
  net-execution-sim:
    driver: bridge

volumes:
  maverick-data:
