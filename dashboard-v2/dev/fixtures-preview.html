<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard V2 — fixture preview (dev only, not shipped)</title>
<link rel="stylesheet" href="../css/app.css">
<style>.dev-bar { background: #12151a; color: #fff; padding: 10px 20px; font-size: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.dev-bar select, .dev-bar button { font-size: 12px; padding: 4px 8px; }</style>
</head>
<body>
<div class="dev-bar">
  <strong>DEV FIXTURE PREVIEW</strong> — not part of the shipped app, not linked from index.html
  <label>Fixture: <select id="fx"><option value="FIXTURE_BACKTEST">Populated backtest run</option><option value="FIXTURE_LIVE_EMPTY">Empty live-paper account</option><option value="FIXTURE_STALE">Stale data</option></select></label>
  <label>Page: <select id="pg"><option value="overview">Overview</option><option value="trades">Trades</option><option value="decisions">Decisions</option><option value="runs">Runs</option><option value="roadmap">Roadmap</option></select></label>
</div>
<div class="shell">
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand"><h1>Trading Agent</h1></div>
      <div class="controls">
        <select class="run-select" aria-label="Preview run"><option>Fixture run · Day 41</option></select>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙 Dark</button>
      </div>
    </div>
    <p class="topbar-meta"><span class="mode-note">Local fixture preview</span><span class="status">No network data</span></p>
  </header>
  <nav class="pages" id="preview-nav" aria-label="Preview pages"></nav>
  <main id="page-root"></main>
  <footer class="appfoot">Synthetic fixtures · for layout verification only</footer>
</div>
<nav class="bottom-nav" id="preview-mobile-nav" aria-label="Preview pages (mobile)"></nav>
<script type="module">
import * as fixtures from "../js/fixtures.js";
import { render as renderOverview } from "../js/pages/overview.js";
import { render as renderTrades } from "../js/pages/trades.js";
import { render as renderDecisions } from "../js/pages/decisions.js";
import { render as renderRuns } from "../js/pages/runs.js";
import { render as renderRoadmap } from "../js/pages/roadmap.js";
import { initTheme } from "../js/theme.js";
initTheme();

const PAGES = { overview: renderOverview, trades: renderTrades, decisions: renderDecisions, runs: renderRuns, roadmap: renderRoadmap };
const fxSel = document.getElementById("fx"), pgSel = document.getElementById("pg"), root = document.getElementById("page-root");

function draw() {
  const data = fixtures[fxSel.value];
  const mode = fxSel.value === "FIXTURE_BACKTEST" ? "backtest" : "live";
  // Registry-backed training-run membership, same shape listSelectableRuns()
  // returns -- lets the fixture preview actually exercise the Overview
  // run-status banner instead of it always reading as "not a training run".
  const runs = mode === "backtest" && data.run_id
    ? [{ run_id: data.run_id, run_kind: "training", latest_day_label: data.trades?.[0]?.day_label }]
    : [];
  root.innerHTML = "";
  PAGES[pgSel.value](root, { ...data, mode, run_id: data.run_id }, { runs });
  for (const id of ["preview-nav", "preview-mobile-nav"]) {
    const nav = document.getElementById(id);
    nav.innerHTML = Array.from(pgSel.options, option => `<button type="button" data-page="${option.value}" aria-current="${option.value === pgSel.value ? "page" : "false"}">${option.text}</button>`).join("");
    nav.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
      pgSel.value = button.dataset.page;
      draw();
    }));
  }
}
fxSel.addEventListener("change", draw);
pgSel.addEventListener("change", draw);
draw();
</script>
</body>
</html>
