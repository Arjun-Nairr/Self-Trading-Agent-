<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Trading Agent Dashboard</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip-link" href="#page-root">Skip to content</a>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>Trading Agent</h1>
      <span class="mode-badge">Backtest research mode</span>
      <span class="status" id="status-line"><span class="dot busy"></span>connecting…</span>
    </div>
    <div class="controls">
      <div id="run-select-wrap"></div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙 Dark</button>
    </div>
  </header>

  <div class="health-bar" id="health-bar" hidden></div>

  <nav class="pages" id="page-nav" aria-label="Dashboard pages"></nav>

  <main id="page-root"></main>

  <footer class="appfoot">Read-only · Neon Data API, anonymous role, SELECT only · refreshes every 15s</footer>
</div>

<nav class="bottom-nav" id="bottom-nav" aria-label="Dashboard pages (mobile)"></nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
