<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Agent Dashboard</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip-link" href="#page-root">Skip to content</a>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <h1>Trading Agent</h1>
      <span class="status" id="status-line"><span class="dot busy"></span>connecting…</span>
    </div>
    <div class="controls">
      <div id="run-select-wrap"></div>
      <div class="segmented" role="group" aria-label="Mode">
        <button type="button" data-mode="backtest" aria-pressed="true">Backtest</button>
        <button type="button" data-mode="live" aria-pressed="false">Live paper</button>
      </div>
    </div>
  </header>

  <nav class="pages" id="page-nav" aria-label="Dashboard pages"></nav>

  <main id="page-root"></main>

  <footer class="appfoot">Read-only · Neon Data API, anonymous role, SELECT only · refreshes every 15s</footer>
</div>

<nav class="bottom-nav" id="bottom-nav" aria-label="Dashboard pages (mobile)"></nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
