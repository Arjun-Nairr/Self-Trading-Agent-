<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Trading Agent // Telemetry</title>
<style>
  :root {
    --bg: #0a0a0a;
    /* Panels sit clearly above the page. The first pass had these 8 hex
       points apart (#0a0a0a vs #121212) and the whole UI read as one flat
       black mass with no visible structure. */
    --panel: #16181c;
    --panel-hi: #1d2026;
    --line: #33363d;
    --fg: #eef0f2;
    --fg-dim: #9ba0a8;
    --fg-faint: #6b7078;
    --red: #ff4d4d;
    --green: #4af626;
    --amber: #f5a623;
    --mono: 'JetBrains Mono', 'IBM Plex Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--mono); font-size: 13px; line-height: 1.5;
    background-image: repeating-linear-gradient(
      0deg, transparent, transparent 2px, rgba(255,255,255,0.010) 2px, rgba(255,255,255,0.010) 4px
    );
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; }

  header {
    display: flex; align-items: flex-end; justify-content: space-between;
    border-bottom: 2px solid var(--fg); padding-bottom: 16px; margin-bottom: 24px;
    flex-wrap: wrap; gap: 16px;
  }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; }
  h1 span.tag { color: var(--fg-faint); font-weight: 400; font-size: 12px; margin-left: 10px; letter-spacing: 0.05em; }
  .status-line { font-size: 11px; letter-spacing: 0.08em; color: var(--fg-dim); text-transform: uppercase; margin-top: 5px; }
  .dot { display: inline-block; width: 6px; height: 6px; background: var(--green); margin-right: 6px; }
  .dot.busy { background: var(--amber); }

  .mode-toggle { display: flex; border: 1px solid var(--fg); }
  .mode-toggle button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    background: var(--bg); color: var(--fg-dim); border: none; padding: 10px 22px; cursor: pointer; font-weight: 700;
  }
  .mode-toggle button + button { border-left: 1px solid var(--fg); }
  .mode-toggle button.active { background: var(--fg); color: var(--bg); }
  .mode-toggle button:hover:not(.active) { color: var(--fg); background: var(--panel-hi); }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--fg-dim); margin-bottom: 10px;
  }
  .section-label::before { content: "[ "; color: var(--fg-faint); }
  .section-label::after { content: " ]"; color: var(--fg-faint); }
  section { margin-bottom: 32px; }

  /* -- summary ------------------------------------------------------- */
  .summary { border: 1px solid var(--line); background: var(--panel); padding: 18px 20px; font-size: 14px; line-height: 1.65; }
  .summary strong { color: var(--fg); font-weight: 700; }
  .summary .flag { color: var(--amber); }

  /* -- stat grid ------------------------------------------------------ */
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .stat { background: var(--panel); padding: 14px 16px; }
  .stat-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); margin-bottom: 6px; }
  .stat-value { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--red); }

  /* -- progress bar ---------------------------------------------------- */
  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .bar-cell { background: var(--panel); padding: 14px 16px; }
  .bar-head { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-faint); margin-bottom: 8px; }
  .bar-head b { color: var(--fg); font-weight: 700; }
  .bar-track { height: 8px; background: var(--bg); border: 1px solid var(--line); }
  .bar-fill { height: 100%; background: var(--fg-dim); }
  .bar-fill.warn { background: var(--amber); }

  /* -- activity feed ---------------------------------------------------- */
  .feed { border: 1px solid var(--line); background: var(--panel); max-height: 330px; overflow-y: auto; }
  .feed-row { display: grid; grid-template-columns: 96px 108px 1fr; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
  .feed-row:last-child { border-bottom: none; }
  .feed-time { color: var(--fg-faint); }
  .feed-type { text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; font-weight: 700; }
  .feed-type.risk_check, .feed-type.order_placed { color: var(--green); }
  .feed-type.order_rejected, .feed-type.exit { color: var(--red); }
  .feed-type.cycle_start, .feed-type.reasoning { color: var(--fg-dim); }
  .feed-type.weekly_reflection { color: var(--amber); }
  .feed-desc { color: var(--fg); }

  /* -- chart ------------------------------------------------------------ */
  .chart-wrap { border: 1px solid var(--line); background: var(--panel); padding: 18px 20px 12px; }
  .chart-legend { display: flex; gap: 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-faint); margin-bottom: 12px; }
  .chart-legend b { color: var(--fg); font-weight: 700; }

  /* -- tables ------------------------------------------------------------ */
  table { width: 100%; border-collapse: collapse; }
  .panel { border: 1px solid var(--line); background: var(--panel); }
  th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-faint); padding: 10px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--panel-hi); }
  .ticker { font-weight: 700; }
  .action-buy { color: var(--green); }
  .action-sell { color: var(--red); }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  /* -- analysis trio ------------------------------------------------------ */
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .trio-cell { background: var(--panel); padding: 16px; }
  .trio-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-faint); margin-bottom: 12px; }
  .kv { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .kv:last-child { border-bottom: none; }
  .kv-key { color: var(--fg-dim); }
  .kv-val { font-weight: 700; }
  .note { font-size: 11px; color: var(--fg-faint); margin-top: 10px; line-height: 1.5; }

  /* -- decision cards -------------------------------------------------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .card { background: var(--panel); padding: 16px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .card-ticker { font-size: 14px; font-weight: 800; }
  .card-time { font-size: 10px; color: var(--fg-faint); text-transform: uppercase; }
  .conf-meter { display: flex; gap: 3px; margin-bottom: 10px; }
  .conf-dot { width: 15px; height: 5px; background: var(--line); }
  .conf-dot.on { background: var(--green); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700; border: 1px solid var(--fg-faint); color: var(--fg-dim); padding: 3px 7px; }
  .card-field { font-size: 10px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 10px; margin-bottom: 3px; }
  .card-value { font-size: 12px; color: var(--fg); }

  .empty { padding: 30px; text-align: center; color: var(--fg-faint); font-size: 12px; }
  .error { padding: 16px; color: var(--red); font-size: 12px; border: 1px solid var(--red); background: rgba(255,77,77,0.07); }

  /* -- loading skeletons ------------------------------------------------- */
  /* The first version swapped modes instantly with no feedback, which read
     as "broken" rather than "fast" -- there was no way to tell a completed
     empty result from a request that never fired. */
  .skel { background: var(--panel); position: relative; overflow: hidden; }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    animation: sweep 1.1s infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .skel-box { border: 1px solid var(--line); height: 74px; }
  .skel-tall { border: 1px solid var(--line); height: 200px; }

  footer { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 36px; font-size: 10px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: 0.05em; text-align: center; }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .trio, .bars { grid-template-columns: 1fr; }
    .feed-row { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Hermes Trading Agent<span class="tag">// telemetry</span></h1>
      <div class="status-line" id="status-line"><span class="dot busy"></span>connecting…</div>
    </div>
    <div class="mode-toggle">
      <button id="btn-backtest" class="active">Training</button>
      <button id="btn-live">Live</button>
    </div>
  </header>

  <section>
    <div class="section-label">Summary</div>
    <div class="summary" id="summary">—</div>
  </section>

  <section>
    <div class="section-label">Account</div>
    <div class="stats" id="stats"></div>
  </section>

  <section>
    <div class="section-label">Run Progress</div>
    <div class="bars" id="bars"></div>
  </section>

  <section>
    <div class="section-label">Activity — What Hermes Is Doing</div>
    <div id="feed" class="feed"></div>
  </section>

  <section>
    <div class="section-label">Equity Curve</div>
    <div class="chart-wrap">
      <div class="chart-legend" id="chart-legend"></div>
      <svg id="chart" viewBox="0 0 1000 260" style="width:100%; height:230px; display:block; overflow:visible;"></svg>
    </div>
  </section>

  <section>
    <div class="section-label">Analysis</div>
    <div class="trio" id="analysis"></div>
  </section>

  <section>
    <div class="section-label">Open Positions</div>
    <div class="panel" id="positions"></div>
  </section>

  <section>
    <div class="section-label">Closed Trades</div>
    <div class="panel" id="closed"></div>
  </section>

  <section>
    <div class="section-label">Recent Decisions</div>
    <div class="cards" id="decisions"></div>
  </section>

  <section>
    <div class="section-label">Insight Log</div>
    <div class="panel" id="insights"></div>
  </section>

  <footer>Read-only · Neon Data API, anonymous role, SELECT only · refreshes every 15s</footer>
</div>

<script>
const AUTH_URL = "https://ep-falling-thunder-b1mr6i56.neonauth.c-5.eu-central-1.aws.neon.tech/neondb/auth";
const DATA_API_URL = "https://ep-falling-thunder-b1mr6i56.apirest.c-5.eu-central-1.aws.neon.tech/neondb/rest/v1";
const REFRESH_MS = 15000;
const STARTING_EQUITY = 100000;
// Mirrors quota_pacer.DEFAULT_WEEKLY_BUDGET and the backtest window in
// run_backtest.py. Same mirroring caveat as risk_checker's RiskLimits:
// change it there, change it here.
const WEEKLY_QUOTA = 175;
const WINDOW_DAYS = 179;  // 2026-02-17 -> 2026-08-14

// One Neon database throughout; mode is a column value, not a separate
// connection. These are the values each table uses for the same concept.
const MODES = {
  backtest: { trades: "backtest", activity: "backtest", snapshots: "backtest" },
  live:     { trades: "alpaca",   activity: "live",     snapshots: "live" },
};
let currentMode = "backtest";

let cachedToken = null, tokenExpiresAt = 0;
async function getAnonToken() {
  const now = Date.now() / 1000;
  if (cachedToken && tokenExpiresAt - now > 30) return cachedToken;
  const res = await fetch(`${AUTH_URL}/token/anonymous`);
  if (!res.ok) throw new Error(`token fetch failed: ${res.status}`);
  const d = await res.json();
  cachedToken = d.token; tokenExpiresAt = d.expires_at;
  return cachedToken;
}
async function q(table, params = "") {
  const token = await getAnonToken();
  const res = await fetch(`${DATA_API_URL}/${table}${params}`, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error(`${table}: ${res.status}`);
  return res.json();
}

const money = n => (n == null) ? "—" : "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
const pctSigned = n => (n == null) ? "—" : (n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%";
const pctPlain  = n => (n == null) ? "—" : Number(n).toFixed(2) + "%";
const time = iso => new Date(iso).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
const esc = s => (s ?? "").toString().replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const el = id => document.getElementById(id);

/* Pair each BUY with the SELL that closed it. RULES.md §9.1 (never average
   down) guarantees one open lot per ticker at a time, so simple sequential
   pairing per ticker is exact here, not an approximation. */
function pairTrades(trades) {
  const byTicker = {};
  for (const t of [...trades].reverse()) (byTicker[t.ticker] ||= []).push(t);
  const closed = [], open = [];
  for (const rows of Object.values(byTicker)) {
    let entry = null;
    for (const t of rows) {
      if (t.status !== "filled") continue;
      if (t.action === "BUY") entry = t;
      else if (t.action === "SELL" && entry) {
        const pnl = (Number(t.fill_price) - Number(entry.fill_price)) * Number(entry.fill_quantity);
        closed.push({ entry, exit: t, pnl, pnlPct: (Number(t.fill_price)/Number(entry.fill_price) - 1) * 100 });
        entry = null;
      }
    }
    if (entry) open.push(entry);
  }
  return { closed, open };
}

function renderSummary(trades, snaps, activity) {
  const { closed, open } = pairTrades(trades);
  const cycles = snaps.length;
  const wins = closed.filter(c => c.pnl > 0).length;
  const blocked = activity.filter(a => a.event_type === "risk_check" && a.description.startsWith("BLOCKED")).length;
  const exits = closed.map(c => (c.exit.strategy_notes || "").replace("Mechanical exit: ", ""));
  const targets = exits.filter(e => e.includes("target")).length;

  if (!cycles && !trades.length) {
    el("summary").innerHTML = `<span class="kv-key">No ${currentMode === "backtest" ? "training" : "live"} data recorded yet. This view populates as soon as the first cycle runs.</span>`;
    return;
  }
  const parts = [];
  parts.push(`<strong>${cycles}</strong> cycle${cycles===1?"":"s"} recorded`);
  parts.push(`<strong>${closed.length + open.length}</strong> position${closed.length+open.length===1?"":"s"} taken (<strong>${open.length}</strong> still open)`);
  if (closed.length) parts.push(`<strong>${wins}/${closed.length}</strong> closed profitably`);
  if (blocked) parts.push(`<strong>${blocked}</strong> decision${blocked===1?"":"s"} blocked by the risk checker`);

  let flag = "";
  if (closed.length >= 2 && targets === 0) {
    flag = `<br><span class="flag">▲ ${closed.length} exits so far and none reached its profit target — every position closed on a stop or a time stop. Worth checking whether §6b's 2:1 requirement is placing targets further away than these names actually travel.</span>`;
  }
  el("summary").innerHTML = parts.join(" · ") + "." + flag;
}

function statCell(label, value, cls = "") {
  return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div></div>`;
}

function renderStats(snap, openCount, closed) {
  const wins = closed.filter(c => c.pnl > 0).length;
  const winRate = closed.length ? `${Math.round(wins/closed.length*100)}%` : "—";
  if (!snap) {
    el("stats").innerHTML = `<div class="stat" style="grid-column:1/-1"><div class="empty">No snapshots recorded yet for this mode.</div></div>`;
    return;
  }
  const dd = Number(snap.drawdown_pct ?? 0);
  const totalRet = (Number(snap.equity) / STARTING_EQUITY - 1) * 100;
  const cells = [
    currentMode === "backtest" ? statCell("Sim Day", esc(snap.day_label || "—")) : statCell("Cash", money(snap.cash)),
    statCell("Equity", money(snap.equity)),
    statCell("Total Return", pctSigned(totalRet), totalRet >= 0 ? "pos" : "neg"),
    statCell("Exposure", pctPlain(snap.exposure_pct)),
    statCell("Drawdown", pctPlain(dd), dd < 0 ? "neg" : ""),
    statCell("Win Rate", `${winRate}${closed.length?` (${closed.length})`:""}`),
  ];
  el("stats").innerHTML = cells.join("");
}

function renderBars(snaps) {
  if (currentMode !== "backtest") {
    el("bars").innerHTML = `<div class="bar-cell" style="grid-column:1/-1"><div class="empty">Run progress applies to training runs.</div></div>`;
    return;
  }
  const latest = snaps[0];
  const dayNum = latest?.day_label ? parseInt(latest.day_label.replace(/\D/g, ""), 10) || 0 : 0;
  const dayPct = Math.min(100, dayNum / WINDOW_DAYS * 100);

  // One snapshot is written per cycle, so counting this week's snapshots IS
  // the quota pacer's cycle count -- no extra field needed to surface it.
  const weekAgo = Date.now() - 7 * 864e5;
  const used = snaps.filter(s => new Date(s.created_at).getTime() > weekAgo).length;
  const quotaPct = Math.min(100, used / WEEKLY_QUOTA * 100);

  el("bars").innerHTML = `
    <div class="bar-cell">
      <div class="bar-head"><span>Backtest window</span><span><b>Day ${dayNum}</b> / ${WINDOW_DAYS}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${dayPct}%"></div></div>
    </div>
    <div class="bar-cell">
      <div class="bar-head"><span>Weekly quota</span><span><b>${used}</b> / ${WEEKLY_QUOTA} cycles</span></div>
      <div class="bar-track"><div class="bar-fill ${quotaPct>75?"warn":""}" style="width:${quotaPct}%"></div></div>
    </div>`;
}

function renderFeed(rows) {
  if (!rows.length) { el("feed").innerHTML = `<div class="empty">No activity logged yet for this mode.</div>`; return; }
  el("feed").innerHTML = rows.map(r => `
    <div class="feed-row">
      <div class="feed-time">${time(r.created_at)}</div>
      <div class="feed-type ${esc(r.event_type)}">${esc(r.event_type).replace(/_/g," ")}</div>
      <div class="feed-desc">${esc(r.description)}</div>
    </div>`).join("");
}

/* Rewritten: the first version drew a bare polyline with no axis, no scale
   and no baseline -- a line that could equally be a 1% wobble or a 50%
   collapse, with no way to tell which. */
function renderChart(snaps) {
  const svg = el("chart"), legend = el("chart-legend");
  if (snaps.length < 2) {
    svg.innerHTML = `<text x="500" y="130" text-anchor="middle" fill="#6b7078" font-size="13" font-family="monospace">${snaps.length ? "One snapshot so far — the curve needs at least two cycles" : "No snapshots yet"}</text>`;
    legend.innerHTML = "";
    return;
  }
  const pts = [...snaps].reverse();
  const vals = pts.map(p => Number(p.equity));
  const last = vals[vals.length - 1];

  // Always include the starting equity in the scale, so the curve is read
  // against "did we make money", not just its own local wiggle.
  const lo = Math.min(...vals, STARTING_EQUITY), hi = Math.max(...vals, STARTING_EQUITY);
  const pad = (hi - lo) * 0.15 || 500;
  const min = lo - pad, max = hi + pad, range = max - min;

  const W = 1000, H = 260, L = 78, R = 16, T = 14, B = 30;
  const x = i => L + (i / (vals.length - 1)) * (W - L - R);
  const y = v => T + (1 - (v - min) / range) * (H - T - B);

  const gridVals = [max, (max + min) / 2, min];
  const grid = gridVals.map(v => `
    <line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}" stroke="#33363d" stroke-width="1"/>
    <text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" fill="#6b7078" font-size="10" font-family="monospace">${Math.round(v).toLocaleString()}</text>
  `).join("");

  const baseY = y(STARTING_EQUITY);
  const baseline = `
    <line x1="${L}" y1="${baseY.toFixed(1)}" x2="${W-R}" y2="${baseY.toFixed(1)}" stroke="#9ba0a8" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="${W-R}" y="${(baseY-7).toFixed(1)}" text-anchor="end" fill="#9ba0a8" font-size="10" font-family="monospace">START ${STARTING_EQUITY.toLocaleString()}</text>`;

  const color = last >= STARTING_EQUITY ? "#4af626" : "#ff4d4d";
  const line = vals.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `${L},${y(min).toFixed(1)} ${line} ${x(vals.length-1).toFixed(1)},${y(min).toFixed(1)}`;
  const dots = vals.map((v,i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${color}"><title>${pts[i].day_label || time(pts[i].created_at)} — ${money(v)}</title></circle>`).join("");

  const firstLbl = pts[0].day_label || time(pts[0].created_at);
  const lastLbl = pts[pts.length-1].day_label || time(pts[pts.length-1].created_at);
  const axis = `
    <text x="${L}" y="${H-8}" fill="#6b7078" font-size="10" font-family="monospace">${esc(firstLbl)}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end" fill="#6b7078" font-size="10" font-family="monospace">${esc(lastLbl)}</text>`;

  svg.innerHTML = `${grid}${baseline}
    <polygon points="${area}" fill="${color}" opacity="0.07"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}${axis}`;

  const change = (last / STARTING_EQUITY - 1) * 100;
  legend.innerHTML = `
    <span>Now <b>${money(last)}</b></span>
    <span>Vs start <b style="color:${color}">${pctSigned(change)}</b></span>
    <span>Peak <b>${money(Math.max(...vals))}</b></span>
    <span>Trough <b>${money(Math.min(...vals))}</b></span>
    <span>Points <b>${vals.length}</b></span>`;
}

function renderAnalysis(trades, activity) {
  const { closed } = pairTrades(trades);

  // 1. Exit reasons -- directly answers whether targets are ever reached.
  const reasons = {};
  for (const c of closed) {
    const r = (c.exit.strategy_notes || "").replace("Mechanical exit: ", "").trim() || "discretionary";
    reasons[r] = (reasons[r] || 0) + 1;
  }
  const exitRows = Object.entries(reasons).sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `<div class="kv"><span class="kv-key">${esc(k)}</span><span class="kv-val">${v}</span></div>`).join("")
    || `<div class="note">No closed trades yet.</div>`;

  // 2. Which RULES.md sections block most often -- tells you which rule to
  //    tune first, rather than guessing.
  const rules = {};
  for (const a of activity) {
    if (a.event_type !== "risk_check" || !a.description.startsWith("BLOCKED")) continue;
    for (const m of a.description.matchAll(/§[0-9]+[a-z]?/g)) rules[m[0]] = (rules[m[0]] || 0) + 1;
  }
  const ruleRows = Object.entries(rules).sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `<div class="kv"><span class="kv-key">${esc(k)}</span><span class="kv-val">${v}</span></div>`).join("")
    || `<div class="note">No blocked decisions recorded.</div>`;

  // 3. Confidence calibration -- the entire point of the confidence field.
  const buckets = {};
  for (const c of closed) {
    const k = c.entry.confidence || 0;
    (buckets[k] ||= { n: 0, wins: 0 });
    buckets[k].n++; if (c.pnl > 0) buckets[k].wins++;
  }
  const confRows = Object.keys(buckets).sort().map(k => {
    const b = buckets[k];
    return `<div class="kv"><span class="kv-key">conf ${k}/5</span><span class="kv-val">${Math.round(b.wins/b.n*100)}% of ${b.n}</span></div>`;
  }).join("") || `<div class="note">Needs closed trades before calibration means anything.</div>`;

  el("analysis").innerHTML = `
    <div class="trio-cell"><div class="trio-title">Exit reasons</div>${exitRows}
      <div class="note">Targets never hitting is evidence §6b's 2:1 minimum sets them beyond these names' real range.</div></div>
    <div class="trio-cell"><div class="trio-title">Blocked by rule</div>${ruleRows}
      <div class="note">The most frequent blocker is the first candidate for tuning.</div></div>
    <div class="trio-cell"><div class="trio-title">Confidence calibration</div>${confRows}
      <div class="note">If high confidence doesn't win more often, the rating carries no information.</div></div>`;
}

function renderPositions(trades, snaps) {
  const { open } = pairTrades(trades);
  if (!open.length) { el("positions").innerHTML = `<div class="empty">No open positions.</div>`; return; }
  el("positions").innerHTML = `<table>
    <thead><tr><th>Ticker</th><th>Qty</th><th>Entry</th><th>Notional</th><th>Confidence</th><th>Opened</th></tr></thead>
    <tbody>${open.map(t => `<tr>
      <td class="ticker">${esc(t.ticker)}</td><td>${t.fill_quantity}</td>
      <td>${money(t.fill_price)}</td><td>${money(t.fill_price * t.fill_quantity)}</td>
      <td>${"●".repeat(t.confidence||0)}${"○".repeat(5-(t.confidence||0))}</td>
      <td>${time(t.created_at)}</td></tr>`).join("")}</tbody></table>`;
}

function renderClosed(trades) {
  const { closed } = pairTrades(trades);
  if (!closed.length) { el("closed").innerHTML = `<div class="empty">No closed trades yet.</div>`; return; }
  el("closed").innerHTML = `<table>
    <thead><tr><th>Ticker</th><th>Qty</th><th>Entry</th><th>Exit</th><th>P&L</th><th>%</th><th>Reason</th></tr></thead>
    <tbody>${closed.reverse().map(c => `<tr>
      <td class="ticker">${esc(c.entry.ticker)}</td><td>${c.entry.fill_quantity}</td>
      <td>${money(c.entry.fill_price)}</td><td>${money(c.exit.fill_price)}</td>
      <td class="${c.pnl>=0?"pos":"neg"}">${c.pnl>=0?"+":""}${money(c.pnl).replace("$","$")}</td>
      <td class="${c.pnl>=0?"pos":"neg"}">${pctSigned(c.pnlPct)}</td>
      <td>${esc((c.exit.strategy_notes||"").replace("Mechanical exit: ",""))}</td></tr>`).join("")}</tbody></table>`;
}

function renderDecisions(trades) {
  const recent = trades.slice(0, 9);
  if (!recent.length) { el("decisions").innerHTML = `<div class="empty" style="grid-column:1/-1">No decisions recorded yet for this mode.</div>`; return; }
  el("decisions").innerHTML = recent.map(t => `
    <div class="card">
      <div class="card-head">
        <span class="card-ticker ${t.action==='BUY'?'action-buy':'action-sell'}">${t.action} ${esc(t.ticker)}</span>
        <span class="card-time">${time(t.created_at)}</span>
      </div>
      ${t.action === "BUY" ? `<div class="conf-meter">${[1,2,3,4,5].map(i=>`<div class="conf-dot ${i<=(t.confidence||0)?"on":""}"></div>`).join("")}</div>` : ""}
      <div class="badges">
        <span class="badge">${esc(t.primary_signal || "—")}</span>
        ${t.technical_basis ? `<span class="badge">${esc(t.technical_basis)}</span>` : ""}
        ${t.action === "BUY" ? `<span class="badge">R:R ${t.expected_reward_risk ?? "—"}</span>` : ""}
        <span class="badge">${esc(t.status)}</span>
      </div>
      ${t.action === "BUY" ? `<div class="card-field">Invalidation condition</div><div class="card-value">${esc(t.invalidation_condition)||"—"}</div>` : ""}
      <div class="card-field">Reasoning</div><div class="card-value">${esc(t.strategy_notes)||"—"}</div>
    </div>`).join("");
}

function renderInsights(rows) {
  if (!rows.length) { el("insights").innerHTML = `<div class="empty">No reflection entries yet — populated during weekly reflection cycles.</div>`; return; }
  el("insights").innerHTML = `<table>
    <thead><tr><th>Cycle</th><th>Insight</th><th>Time</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.cycle_type)}</td><td>${esc(r.insight_text)}</td><td>${time(r.created_at)}</td></tr>`).join("")}</tbody></table>`;
}

function showSkeletons() {
  el("summary").innerHTML = `<span style="color:var(--fg-faint)">querying…</span>`;
  el("stats").innerHTML = `<div class="stat skel" style="grid-column:1/-1;height:74px"></div>`;
  el("bars").innerHTML = `<div class="bar-cell skel" style="grid-column:1/-1;height:66px"></div>`;
  el("feed").innerHTML = `<div class="skel" style="height:200px"></div>`;
  el("analysis").innerHTML = `<div class="trio-cell skel" style="grid-column:1/-1;height:150px"></div>`;
  el("positions").innerHTML = `<div class="skel" style="height:90px"></div>`;
  el("closed").innerHTML = `<div class="skel" style="height:90px"></div>`;
  el("decisions").innerHTML = `<div class="card skel" style="grid-column:1/-1;height:150px"></div>`;
  el("chart").innerHTML = "";
  el("chart-legend").innerHTML = "";
}

async function refresh(withSkeletons = false) {
  if (withSkeletons) showSkeletons();
  const m = MODES[currentMode];
  el("status-line").innerHTML = `<span class="dot busy"></span>${currentMode.toUpperCase()} · querying neon…`;

  try {
    const [trades, activity, snaps, insights] = await Promise.all([
      q("trades", `?execution_mode=eq.${m.trades}&order=created_at.desc&limit=200`),
      q("agent_activity", `?mode=eq.${m.activity}&order=created_at.desc&limit=80`),
      q("portfolio_snapshots", `?mode=eq.${m.snapshots}&order=created_at.desc&limit=300`),
      q("insight_log", "?order=created_at.desc&limit=20"),
    ]);
    const { closed, open } = pairTrades(trades);

    renderSummary(trades, snaps, activity);
    renderStats(snaps[0], open.length, closed);
    renderBars(snaps);
    renderFeed(activity);
    renderChart(snaps);
    renderAnalysis(trades, activity);
    renderPositions(trades, snaps);
    renderClosed(trades);
    renderDecisions(trades);
    renderInsights(insights);

    el("status-line").innerHTML = `<span class="dot"></span>${currentMode.toUpperCase()} · live @ neon · updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    el("status-line").innerHTML = `<span class="dot busy"></span>${currentMode.toUpperCase()} · error`;
    el("summary").innerHTML = `<div class="error">Failed to load: ${esc(e.message)}</div>`;
  }
}

function setMode(mode) {
  if (mode === currentMode) return;
  currentMode = mode;
  el("btn-backtest").classList.toggle("active", mode === "backtest");
  el("btn-live").classList.toggle("active", mode === "live");
  refresh(true);
}
el("btn-backtest").onclick = () => setMode("backtest");
el("btn-live").onclick = () => setMode("live");

refresh(true);
setInterval(() => refresh(false), REFRESH_MS);
</script>
</body>
</html>
